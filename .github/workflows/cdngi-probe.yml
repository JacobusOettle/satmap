# Throwaway probe (branch claude/cdngi-speedtest only): load the CD:NGI geoportal in a headless browser as an anonymous
# visitor and ask it the same read-only question its own search panel asks (may this visitor use Download / Clip-Zip-Ship?).
name: cdngi-probe

on:
  push:
    branches: [claude/cdngi-speedtest]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Install Playwright
        run: |
          pip install -q playwright==1.47.0
          python -m playwright install --with-deps chromium > /dev/null
      - name: Load portal anonymously and check download access
        run: |
          mkdir -p out && cd out
          cat > probe.py <<'PY'
          import json
          from playwright.sync_api import sync_playwright
          UA = "SatMap download speed test (one-off, a few files)"
          JS = """() => new Promise((resolve) => {
            const out = {};
            try {
              out.identity = (typeof $sessionManager !== 'undefined') ? 'sessionManager present' : 'no sessionManager';
              const r = $webRequest.create({ name: "ApolloSearch", query: { action: "getCZSAccess" },
                body: { mapServiceId: "3f0cc9ff-234f-4c3a-a184-77dae330a137" },
                callback: function (ex) { try { out.getCZSAccess = ex.get_object(); } catch (e) { out.getCZSAccess = 'ERR ' + e; } resolve(out); } });
              r.invoke();
            } catch (e) { out.exception = '' + e; resolve(out); }
            setTimeout(() => { out.timeout = true; resolve(out); }, 60000);
          })"""
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(user_agent=UA, viewport={"width": 1600, "height": 1000})
              calls = []
              pg.on("request", lambda r: calls.append(r.method + " " + r.url[:160]) if ".ashx" in r.url or "erdas" in r.url else None)
              cons = []
              pg.on("console", lambda m: cons.append(m.type + ": " + m.text[:200]))
              pg.on("pageerror", lambda e: cons.append("pageerror: " + str(e)[:200]))
              pg.goto("https://ngigeoportal.dlrrd.gov.za/cdngiportal/", wait_until="load", timeout=180000)
              try:
                  pg.wait_for_function("() => typeof theForm !== 'undefined' && !!document.forms[0]", timeout=240000)
                  print("theForm ready")
              except Exception as e:
                  print("theForm never appeared:", str(e)[:200])
              pg.wait_for_timeout(15000)
              print("console:"); [print("  ", c) for c in cons[:40]]
              pg.screenshot(path="portal.png")
              print("title:", pg.title())
              print("result:", json.dumps(pg.evaluate(JS), indent=1))
              txt = pg.evaluate("() => document.body.innerText")
              for k in ["Log in", "Login", "Sign in", "Register", "Sign up", "Logout"]:
                  print(f"text contains {k!r}:", k in txt)
              print("ashx/erdas requests during load:")
              seen = set()
              for c in calls:
                  key = c.split("?")[0]
                  if key not in seen:
                      seen.add(key); print("  ", c)
              b.close()
          PY
          python probe.py
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cdngi-portal-shot
          path: out/portal.png
          retention-days: 3
