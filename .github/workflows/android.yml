name: Android app

# Tests the Android app (core and app unit tests), builds SatMap.apk and checks that it opens on an emulator, on every
# branch and pull request (each work package's branch is merged only when this is green, android/DESIGN.md §7.3).
# Builds of main and claude/satmap-ios-app, and a workflow_dispatch, are then published as the "android-test-build"
# pre-release, always at https://github.com/JacobusOettle/satmap/releases/download/android-test-build/SatMap.apk
on:
  workflow_dispatch:
  push:
    branches: ["**", "!claude/android-overlay-debug"]
    paths:
      - "android/**"
      - "SatMap/Resources/**"
      - "Tests/SatMapCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "SatMap/Resources/**"
      - "Tests/SatMapCoreTests/Fixtures/**"
      - ".github/workflows/android.yml"

# Read-only: the build runs Gradle plugins, dependencies and third-party actions from the internet. Only publish can
# write to the repository.
permissions:
  contents: read

# Two groups. A newer push to the same branch or pull request cancels the build of an older one. Publishing is one
# queue for every branch (main, claude/satmap-ios-app, a workflow_dispatch elsewhere), because they all write the one
# android-test-build release; a publish that has started is never cancelled halfway, so the APK, the notes and the tag
# always come from the same commit.
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: android-apk-${{ github.ref }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Gradle's caches (dependencies, and the build cache with its test results) are saved by builds of main and
      # claude/satmap-ios-app; setup-gradle on its own saves only on the default branch. Other branches and pull
      # requests only read them (GitHub gives a run the caches of its branch, the default branch and a pull
      # request's base), so the repository's cache space isn't filled with an entry per branch. A cached test result
      # is reused whenever the task's declared inputs are unchanged, so every test task must declare the folders it
      # reads outside android/ as inputs (android/DESIGN.md §5.5).
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/claude/satmap-ios-app' }}

      - name: Signing key from the repository secrets, if there is one
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # All four, or none (the public test key). An empty one would otherwise reach Gradle as an empty alias or
          # password and fail there with a less clear message.
          given=0
          missing=""
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then given=$((given + 1)); else missing="$missing $name"; fi
          done
          if [ "$given" -eq 0 ]; then
            echo "No signing secrets: signing with the public test key (android/signing/README.md)."
            exit 0
          fi
          if [ -n "$missing" ]; then
            echo "::error::Signing with a private key needs all four repository secrets. Missing or empty:$missing"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Signing with the private key from the secrets."

      - name: Unit tests
        # Also packages the debug APK (what the emulator workflows install) and compiles the instrumented tests (run
        # on an emulator by android-screenshots.yml), so both keep building.
        run: ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:assembleDebug :app:compileDebugAndroidTestKotlin

      - name: Build SatMap.apk
        run: |
          ./gradlew --console=plain :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../SatMap.apk
          ls -l ../SatMap.apk

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: |
            android/core/build/reports/tests
            android/app/build/reports/tests

      - uses: actions/upload-artifact@v7
        with:
          name: SatMap-apk
          path: SatMap.apk

      # A build that doesn't open must not replace the one people install: start it on an emulator first. MapLibre is
      # its multi-backend build (android/DESIGN.md D1), which draws with the emulator's SwiftShader Vulkan.
      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Check that the app opens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          working-directory: .
          # The runner starts each line in its own `sh -c`: every check is one line. Every permission the app asks for
          # is granted first, so no system dialog covers the map in the screenshot or leaves MainActivity paused.
          # The last check reads the middle of the screen from a raw capture (android-launch.raw: a 12- or 16-byte
          # header, then 4 bytes a pixel), taken right after the screenshot: imagery (many colours), or, when Esri's
          # servers don't answer the emulator, mostly the map's background #202020, which only a running map renderer
          # draws. A black or other flat screen fails.
          script: |
            adb install -r SatMap.apk
            adb shell pm grant com.jacobusoettle.satmap android.permission.ACCESS_FINE_LOCATION || true
            adb shell pm grant com.jacobusoettle.satmap android.permission.ACCESS_COARSE_LOCATION || true
            adb shell pm grant com.jacobusoettle.satmap android.permission.ACTIVITY_RECOGNITION || true
            adb shell pm grant com.jacobusoettle.satmap android.permission.POST_NOTIFICATIONS || true
            adb shell svc power stayon true || true
            adb shell input keyevent KEYCODE_WAKEUP || true
            adb shell wm dismiss-keyguard || true
            adb logcat -c
            adb shell am start -W -n com.jacobusoettle.satmap/.MainActivity
            sleep 30
            adb exec-out screencap -p > android-launch.png || true
            adb exec-out screencap > android-launch.raw || true
            adb shell pidof com.jacobusoettle.satmap || { echo "SatMap quit after it was opened: not publishing this build."; adb logcat -d -b crash; adb logcat -d | grep -iE "satmap|AndroidRuntime|maplibre|mbgl" | tail -n 150; exit 1; }
            if adb logcat -d -b crash | grep -q com.jacobusoettle.satmap; then echo "SatMap crashed after it was opened (and was started again): not publishing this build."; adb logcat -d -b crash; exit 1; fi
            if adb logcat -d -b events | grep am_anr | grep -q com.jacobusoettle.satmap; then echo "SatMap stopped responding after it was opened: not publishing this build."; adb logcat -d -b events | grep am_anr; adb logcat -d | grep -iE "satmap|ANR" | tail -n 150; exit 1; fi
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -q 'com.jacobusoettle.satmap/.MainActivity' || { echo "SatMap's map is not the resumed activity: not publishing this build."; adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity|mFocusedApp|mCurrentFocus'; adb logcat -d | grep -iE "satmap|AndroidRuntime" | tail -n 150; exit 1; }
            python3 -I -c "import collections, struct, sys; d = open('android-launch.raw', 'rb').read(); w, h = struct.unpack('<2I', d[:8]); head = len(d) - w * h * 4; assert head in (12, 16), 'not a 4-byte-a-pixel capture'; px = [tuple(d[head + (y * w + x) * 4:head + (y * w + x) * 4 + 3]) for y in range(h * 35 // 100, h * 65 // 100, 8) for x in range(w * 30 // 100, w * 70 // 100, 8)]; common = collections.Counter(px).most_common(1)[0][0]; kinds = len(set(px)); print('Middle of the', w, 'x', h, 'screen:', kinds, 'colours, mostly', common); sys.exit(not (common == (32, 32, 32) or kinds > 64))" || { echo "SatMap's map was not drawn: the middle of the screen is neither imagery nor the map's background colour #202020. Not publishing this build."; adb logcat -d | grep -iE "satmap|maplibre|mbgl|EGL|OpenGLRenderer" | tail -n 150; exit 1; }
            echo "SatMap is running, with its map in front and drawn."

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-launch-screenshot
          path: android-launch.png
          if-no-files-found: ignore

  # Only builds of main and claude/satmap-ios-app (and a workflow_dispatch) replace the APK people install; work
  # package branches and pull requests are only tested.
  publish:
    needs: apk
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/claude/satmap-ios-app'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    concurrency:
      group: android-test-build
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SatMap-apk

      - name: Publish as the android-test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Android build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Open SatMap.apk on the phone to install it (allow installing from your browser or Files app when asked)."
          # Replaced in place, so the download link never goes missing; a new release only when there is none.
          if gh release view android-test-build > /dev/null 2>&1; then
            gh release upload android-test-build SatMap.apk --clobber
            gh release edit android-test-build --prerelease --notes "$notes"
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/android-test-build" -f sha="$GITHUB_SHA" -F force=true > /dev/null \
              || echo "The tag stays at the earlier commit."
          else
            gh release create android-test-build SatMap.apk --prerelease --target "$GITHUB_SHA" --title "SatMap Android test build" --notes "$notes"
          fi
