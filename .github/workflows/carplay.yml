name: CarPlay

# Runs the app in an iPhone simulator with Simulator's CarPlay screen open and screenshots both screens, to see the
# car's map (SatMap/CarPlay) without a car. Simulator shows the CarPlay app with the entitlement in
# SatMap/SatMap.entitlements (ad hoc signed here); a real car needs it granted by Apple.
on:
  workflow_dispatch:
  push:
    paths:
      - "SatMap/CarPlay/**"
      - "SatMap/Map/DrawnImagery.swift"
      - "SatMap/Info.plist"
      - ".github/workflows/carplay.yml"

concurrency:
  group: carplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  carplay:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              version = tuple(int(v) for v in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if d["name"] in ("iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro") and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"])
          print(best[1])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Older Simulator versions only offer the CarPlay screen with this set.
          defaults write com.apple.iphonesimulator CarPlay -bool YES
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build the app
        run: |
          set +e
          xcodebuild build -project SatMap.xcodeproj -scheme SatMap -configuration Release \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sort -u | head -n 50
          tail -n 5 build.log
          codesign -d --entitlements :- build/Build/Products/Release-iphonesimulator/SatMap.app 2>/dev/null | head -n 20 || true
          exit $status

      - name: Open Simulator with the CarPlay screen
        run: |
          mkdir -p carplay
          open -a Simulator --args -CurrentDeviceUDID "$UDID"
          sleep 15
          # I/O > External Displays > CarPlay (the menu's place has moved between Xcode versions: search for it).
          osascript <<'EOF' 2>&1 | tee carplay/menu.txt || true
          tell application "Simulator" to activate
          delay 2
          tell application "System Events"
            tell process "Simulator"
              set found to false
              repeat with m in menu bar items of menu bar 1
                try
                  repeat with i in menu items of menu 1 of m
                    if name of i is "External Displays" then
                      click (menu item "CarPlay" of menu 1 of i)
                      set found to true
                    end if
                  end repeat
                end try
                if found then exit repeat
              end repeat
              if found then
                return "CarPlay screen opened"
              else
                return "No CarPlay menu item"
              end if
            end tell
          end tell
          EOF
          sleep 10

      - name: Run the app, standing still and then driving
        run: |
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/SatMap.app
          xcrun simctl privacy "$UDID" grant location com.jacobusoettle.satmap || true
          xcrun simctl location "$UDID" set -24.9969,31.5923
          xcrun simctl spawn "$UDID" log stream --level debug --style compact \
            --predicate 'subsystem == "com.jacobusoettle.satmap"' > carplay/app.log 2>&1 &
          LOGPID=$!
          xcrun simctl launch "$UDID" com.jacobusoettle.satmap
          sleep 40
          xcrun simctl io "$UDID" screenshot --display=internal carplay/phone.png || true
          xcrun simctl io "$UDID" screenshot --display=external carplay/car-home.png || true
          # Open SatMap on the car's screen. First through the window's accessibility elements (Simulator passes on
          # the screen's): press the one named SatMap, if there is one.
          osascript <<'EOF' 2>&1 | tee -a carplay/menu.txt || true
          tell application "Simulator" to activate
          delay 1
          tell application "System Events"
            tell process "Simulator"
              set w to missing value
              repeat with c in windows
                if name of c contains "CarPlay" then set w to c
              end repeat
              if w is missing value then return "No CarPlay window"
              set out to ""
              set pressed to false
              repeat with e in (entire contents of w)
                set d to ""
                try
                  set d to d & (role of e as text)
                end try
                try
                  set d to d & " | " & (description of e as text)
                end try
                try
                  set d to d & " | " & (name of e as text)
                end try
                set out to out & d & linefeed
                if (not pressed) and d contains "SatMap" then
                  try
                    perform action "AXPress" of e
                    set pressed to true
                    set out to out & "pressed the element above" & linefeed
                  end try
                end if
              end repeat
              return out
            end tell
          end tell
          EOF
          sleep 15
          xcrun simctl io "$UDID" screenshot --display=external carplay/car-ax.png || true
          # Then a real mouse click on its icon (System Events' "click at" doesn't reach the screen): where the CarPlay
          # home screen puts it, second row, first app, about 205, 300 of the 800 x 480 screen.
          cat > "$RUNNER_TEMP/click.swift" <<'EOF'
          import CoreGraphics
          import Foundation
          let p = CGPoint(x: Double(CommandLine.arguments[1])!, y: Double(CommandLine.arguments[2])!)
          for type in [CGEventType.mouseMoved, .leftMouseDown, .leftMouseUp] {
              CGEvent(mouseEventSource: nil, mouseType: type, mouseCursorPosition: p, mouseButton: .left)?.post(tap: .cghidEventTap)
              usleep(150_000)
          }
          EOF
          swiftc -o "$RUNNER_TEMP/click" "$RUNNER_TEMP/click.swift" || true
          GEOMETRY=$(osascript -e 'tell application "System Events" to tell process "Simulator"
            repeat with w in windows
              if name of w contains "CarPlay" then
                set {x, y} to position of w
                set {wd, ht} to size of w
                return (x as text) & " " & (y as text) & " " & (wd as text) & " " & (ht as text)
              end if
            end repeat
            return ""
          end tell' || true)
          echo "CarPlay window: $GEOMETRY" | tee -a carplay/menu.txt
          if [ -n "$GEOMETRY" ]; then
            read -r X Y W H CX CY <<< "$(echo "$GEOMETRY" | awk '{k = $3 / 800; top = $2 + $4 - 480 * k; print $1, $2, $3, $4, int($1 + 205 * k), int(top + 300 * k)}')"
            osascript -e 'tell application "Simulator" to activate' || true
            sleep 1
            "$RUNNER_TEMP/click" "$CX" "$CY" && echo "clicked SatMap at $CX, $CY" | tee -a carplay/menu.txt
          fi
          sleep 25
          xcrun simctl io "$UDID" screenshot --display=external carplay/car.png || true
          screencapture -x carplay/mac-screen-car.png || true
          # Drive along the H4-1 towards Skukuza.
          xcrun simctl location "$UDID" start --speed=20 -24.9969,31.5923 -24.9900,31.6100 -24.9800,31.6300 || true
          sleep 30
          xcrun simctl io "$UDID" screenshot --display=external carplay/car-driving.png || true
          xcrun simctl location "$UDID" clear || true
          kill $LOGPID || true
          screencapture -x carplay/mac-screen.png || true
          # Crash reports of the app, if it crashed.
          find ~/Library/Logs/DiagnosticReports -name "SatMap*" -exec cp {} carplay/ \; 2>/dev/null || true
          ls -l carplay
          grep -E "drawn z|map stopped|error" carplay/app.log | tail -n 20 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: carplay
          path: |
            carplay
            build.log
