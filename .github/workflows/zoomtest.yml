name: Zoom test

# Records the iPhone simulator's screen while SatMapUITests/ZoomTests zooms and pans the map, once for each way of
# drawing the imagery, from a fresh install each time (nothing cached). The videos are uploaded for frame-by-frame
# checks of empty blocks while tiles load. Runs when the test, the imagery layers or this file change (or by hand
# from main).
on:
  workflow_dispatch:
  push:
    paths:
      - "SatMapUITests/ZoomTests.swift"
      - ".github/workflows/zoomtest.yml"
      - "SatMap/Map/SatelliteLayer.swift"
      - "SatMap/Map/ZoomScript.swift"

concurrency:
  group: zoomtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zoom:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Boot an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              version = tuple(int(v) for v in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if d["name"] in ("iPhone 16 Pro", "iPhone 17 Pro", "iPhone 15 Pro") and (best is None or version > best[0]):
                      best = (version, d["udid"], d["name"])
          print(best[1])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Build app and UI tests
        run: |
          set +e
          xcodebuild build-for-testing -project SatMap.xcodeproj -scheme SatMap -configuration Release \
            -destination "id=$UDID" -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- > build.log 2>&1
          status=$?
          grep -E "error:" build.log | sort -u | head -n 50
          tail -n 5 build.log
          exit $status

      - name: Zoom and pan, recording the screen
        run: |
          mkdir -p videos
          # Drawn (the default), with contour lines (on by default), and Tiles. Single and BackdropContours
          # (ZoomTests) can be added back to the list.
          for mode in Renderer RendererContours Backdrop; do
            xcrun simctl spawn "$UDID" log stream --level info --style compact \
              --predicate 'subsystem == "com.jacobusoettle.satmap" AND category == "zoomscript"' > "videos/script-$mode.log" 2>&1 &
            LOGPID=$!
            # Tile requests and drawing, for what lies behind grey in the video.
            xcrun simctl spawn "$UDID" log stream --level debug --style compact \
              --predicate 'subsystem == "com.jacobusoettle.satmap" AND category IN {"tiles", "zoomscript"}' > "videos/tiles-$mode.log" 2>&1 &
            TILEPID=$!
            xcrun simctl uninstall "$UDID" com.jacobusoettle.satmap || true
            xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/SatMap.app
            xcrun simctl privacy "$UDID" grant location com.jacobusoettle.satmap || true
            xcrun simctl io "$UDID" recordVideo --codec=h264 --force "videos/zoom-$mode.mp4" &
            REC=$!
            date -u +"recording $mode started %Y-%m-%d %H:%M:%S.%N" | tee -a videos/times.txt
            sleep 2
            xcodebuild test-without-building -xctestrun "$(ls build/Build/Products/*.xctestrun | head -n 1)" \
              -destination "id=$UDID" -only-testing:SatMapUITests/ZoomTests/testScript$mode > "videos/test-$mode.log" 2>&1 \
              || tail -n 30 "videos/test-$mode.log"
            kill -INT $REC
            wait $REC || true
            kill $LOGPID $TILEPID || true
            cat "videos/script-$mode.log"
            grep -E "Start Test at|t = .*(Double tap|Two finger|Pinch with|Swipe|Launch)" "videos/test-$mode.log" | tee -a videos/times.txt | head -n 20 || true
          done
          ls -l videos

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoom-videos
          path: videos
