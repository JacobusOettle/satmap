name: iPhone app

# Builds an unsigned SatMap.ipa for installing with a sideloading tool (Impactor, Sideloadly, AltStore),
# which signs it with your Apple ID. Published as the "test-build" pre-release, always at
# https://github.com/JacobusOettle/satmap/releases/download/test-build/SatMap.ipa
on:
  workflow_dispatch:
  push:
    branches: [main, claude/satmap-ios-app]
    paths:
      - "SatMap/**"
      - "SatMap.xcodeproj/**"
      - ".github/workflows/ipa.yml"

permissions:
  contents: write

concurrency:
  group: ipa
  cancel-in-progress: true

jobs:
  ipa:
    # Xcode 26 (iOS 26 SDK): needed for downloads that carry on in the background with a Lock Screen progress bar.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: xcodebuild -version

      - name: Build for iPhone (unsigned)
        run: |
          set +e
          xcodebuild build -project SatMap.xcodeproj -scheme SatMap -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" > build.log 2>&1
          status=$?
          grep -E "(error|warning):" build.log | grep -v "^ld: warning" | sort -u | head -n 100
          tail -n 20 build.log
          exit $status

      - name: Package SatMap.ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/SatMap.app Payload/
          lipo -info Payload/SatMap.app/SatMap
          # Background downloads need the iOS 26 SDK: stop if they were left out of the build.
          nm -u Payload/SatMap.app/SatMap | grep -q BGContinuedProcessingTaskRequest || { echo "Built without background downloads (needs Xcode 26)"; exit 1; }
          plutil -p Payload/SatMap.app/Info.plist | grep -E "CFBundleIdentifier|CFBundleShortVersionString|MinimumOSVersion"
          zip -qry SatMap.ipa Payload
          ls -l SatMap.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: SatMap-ipa
          path: SatMap.ipa

      # A build that doesn't open must not replace the one people install: start it in a simulator first.
      - name: Check that the app opens
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          best = None
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "SimRuntime.iOS" not in runtime:
                  continue
              version = tuple(int(v) for v in runtime.split("iOS-")[-1].split("-"))
              for d in devices:
                  if d["name"].startswith("iPhone") and (best is None or version > best[0]):
                      best = (version, d["udid"])
          print(best[1])
          ')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          set +e
          xcodebuild build -project SatMap.xcodeproj -scheme SatMap -configuration Release \
            -destination "id=$UDID" -derivedDataPath simbuild CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- > simbuild.log 2>&1
          status=$?
          set -e
          if [ $status -ne 0 ]; then grep -E "error:" simbuild.log | sort -u | head -n 50; exit 1; fi
          xcrun simctl install "$UDID" simbuild/Build/Products/Release-iphonesimulator/SatMap.app
          xcrun simctl privacy "$UDID" grant location com.jacobusoettle.satmap || true
          xcrun simctl location "$UDID" set -24.9969,31.5923
          pid=$(xcrun simctl launch "$UDID" com.jacobusoettle.satmap | awk '{print $NF}')
          sleep 30
          if ! ps -p "$pid" > /dev/null; then
            echo "SatMap quit after it was opened: not publishing this build."
            find ~/Library/Logs/DiagnosticReports -name "SatMap*" -exec head -n 120 {} \; 2>/dev/null || true
            exit 1
          fi
          echo "SatMap is running (pid $pid)."

      - name: Publish as the test-build pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build SatMap.ipa --prerelease --target "$GITHUB_SHA" \
            --title "SatMap test build" \
            --notes "Unsigned build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Sign and install it with Impactor (or Sideloadly or AltStore) using your Apple ID."
