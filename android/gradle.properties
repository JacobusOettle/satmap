org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# Several builds can run side by side on a 15 GB build machine: Kotlin compiles inside the Gradle process (no
# second daemon per build), idle daemons leave after 15 minutes, and at most three workers run at once.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=900000
org.gradle.workers.max=3
